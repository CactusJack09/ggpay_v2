name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build APK
        working-directory: mobile
        run: flutter build apk --split-per-abi --dart-define=BACKEND_URL=https://ggpay-backend.onrender.com

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ggpay-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
